[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nohack"
version = "0.1.0.dev0"
description = "No Hack: local-first Windows network-flow threat and anomaly detection"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []
keywords = ["network-security", "intrusion-detection", "machine-learning", "windows"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "build>=1.2,<2",
]
ml-core = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scipy>=1.12,<2",
    "pyarrow>=17,<25",
    "scikit-learn>=1.5,<2",
    "xgboost>=2,<4",
    "lightgbm>=4,<5",
    "catboost>=1.2,<2",
    "joblib>=1.3,<2",
]
ml = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scipy>=1.12,<2",
    "pyarrow>=17,<25",
    "scikit-learn>=1.5,<2",
    "xgboost>=2,<4",
    "lightgbm>=4,<5",
    "catboost>=1.2,<2",
    "imbalanced-learn>=0.12,<1",
    "optuna>=4,<5",
    "shap>=0.46,<1",
    "mlflow>=2.17,<4",
    "pandera>=0.21,<1",
    "evidently>=0.5,<1",
]
capture = ["scapy>=2.6,<3", "psutil>=6,<9"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
ui = ["PySide6>=6.8,<7"]
packaging = ["pyinstaller>=6.10,<7"]

[project.scripts]
nohack = "nohack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nohack", "nohack.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["windows: tests requiring an actual Windows environment"]

[tool.coverage.run]
branch = true
source = ["nohack"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/nohack"]
