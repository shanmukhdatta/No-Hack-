name: No Hack CI

on:
  push:
    branches: [main, 'phase-**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install with dev and capture extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,capture]" -c requirements/dev-py311-constraints.txt
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format check
        run: python -m ruff format --check .
      - name: Mypy
        run: >-
          python -m mypy src/nohack/features src/nohack/capture
          src/nohack/collector src/nohack/config src/nohack/runtime
          src/nohack/storage/observations.py src/nohack/storage/predictions.py
          src/nohack/native_host.py src/nohack/cli.py
      - name: Pytest with coverage
        run: >-
          python -m pytest
          --cov=nohack.features --cov=nohack.capture
          --cov=nohack.collector --cov=nohack.native_host
          --cov=nohack.runtime --cov=nohack.storage --cov=nohack.config
          --cov-report=term-missing --cov-fail-under=85
      - name: Build sdist and wheel
        if: runner.os == 'Linux'
        run: python -m build
      - name: Wheel smoke check
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import nohack; print(nohack.__version__)"
          nohack doctor

  extension:
    name: Chrome MV3 / Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JS syntax
        run: |
          node --check extension/background.js
          node --check extension/ui.js
          node --check extension/logic.mjs
      - name: Browser logic tests
        run: node --test extension/tests/*.test.mjs
      - name: Validate Chrome manifest
        run: node -e "const m=require('./extension/manifest.json'); if(m.manifest_version!==3 || !m.background?.service_worker) process.exit(1)"

  ml:
    name: Hybrid ML / Python 3.11 / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ML-core and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,capture,ml-core,api]" -c requirements/dev-py311-constraints.txt
      - name: Synthetic training and artifact integrity smoke
        run: >-
          python -m pytest -q -v tests/test_ml_core.py tests/test_prediction_store.py
          tests/test_api_optional.py tests/test_monitoring_drift.py
          tests/test_evaluation_metrics.py tests/test_extension_package.py
          tests/test_model_connection.py tests/test_canonical_combine.py
          tests/test_demo_pipeline.py tests/test_api_demo_status.py
          tests/test_component_readiness.py tests/test_alert_gate.py
          tests/test_annotation_review.py tests/test_latency_and_summary.py
          tests/test_calibration.py tests/test_baselines.py
      - name: Synthetic DEMO end-to-end executable (never real IDS metrics)
        run: >-
          python scripts/demo_model_pipeline.py
          --output-dir artifacts/demo/ci-smoke --groups 24 --folds 3

  temporary-autoformat:
    name: One-time PR source formatter (to be removed)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "ruff>=0.11,<1"
      - name: Apply only safe lint and formatting fixes
        run: |
          python -m ruff check --fix .
          python -m ruff format .
      - name: Commit normalized code to source branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize consolidated engineering modules"
            git fetch origin "${GITHUB_HEAD_REF}"
            git rebase "origin/${GITHUB_HEAD_REF}"
            git push "origin" "HEAD:${{ github.head_ref }}"
          fi
