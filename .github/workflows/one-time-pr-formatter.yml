name: One-time No Hack source formatting
on:
  push:
    branches: [feat/verified-pcap-annotation-workflow]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install formatter
        run: python -m pip install "ruff>=0.11,<1"
      - name: Safe automated lint + canonical format
        run: |
          python -m ruff check --fix .
          python -m ruff format .
      - name: Commit formatted files to this same branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: autoformat new engineering components with Ruff"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
