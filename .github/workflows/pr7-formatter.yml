name: PR7 temporary formatter

on:
  push:
    branches:
      - feature/chrome-only-complete-stack

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.repository == 'shanmukhdatta/No-Hack-'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chrome-only-complete-stack
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'ruff==0.17.0'
      - name: Format checked-in Python
        run: |
          python -m ruff check --fix .
          python -m ruff format .
          git status --short
      - name: Commit formatting if necessary
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "Apply Ruff lint and formatting to Chrome-first implementation"
            git push origin HEAD:feature/chrome-only-complete-stack
          fi
